server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # Security Headers for WebAssembly (SharedArrayBuffer)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Proper MIME types for WebAssembly and TeX formats
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream fmt gz;
        application/javascript js mjs;
    }

    # Static Assets & SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Cache WasmTex engine binaries
    location /wasmtex/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # TeX Live 2025 Reverse Proxy (Bypass CORS 403 on R2)
    location ~ ^/texlive/2025/(.*)$ {
        proxy_pass https://texlive.corca.ai/snapshots/2025-92e10d3241a312f0/2025/$1;
        proxy_set_header Origin "https://corca-ai.github.io";
        proxy_set_header Referer "https://corca-ai.github.io/";
        proxy_ssl_server_name on;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # TeX Live 2026 Reverse Proxy (Bypass CORS 403 on R2)
    location ~ ^/texlive/2026/(.*)$ {
        proxy_pass https://texlive.corca.ai/snapshots/2026-ba38749b8714505a/2026/$1;
        proxy_set_header Origin "https://corca-ai.github.io";
        proxy_set_header Referer "https://corca-ai.github.io/";
        proxy_ssl_server_name on;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}
